version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardexchange-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CardExchange;User Id=sa;Password=${SA_PASSWORD:-CardExchange2024!};TrustServerCertificate=True
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-ChangeThisToASecureKeyInProduction123456!}
      - JwtSettings__Issuer=CardExchangeAPI
      - JwtSettings__Audience=CardExchangeClient
      - JwtSettings__ExpirationInMinutes=60
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost:5173}
      - Email__Smtp__Host=${SMTP_HOST:-}
      - Email__Smtp__Port=${SMTP_PORT:-587}
      - Email__Smtp__Username=${SMTP_USERNAME:-}
      - Email__Smtp__Password=${SMTP_PASSWORD:-}
      - Email__Smtp__UseStartTls=${SMTP_USE_STARTTLS:-true}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-no-reply@example.com}
      - Email__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:5173}
      - PlanLimits__FreeMaxCards=${PLAN_FREE_MAX_CARDS:-}
      - Registration__MinimumAge=${REGISTRATION_MINIMUM_AGE:-14}
      - Billing__BankTransfer__Enabled=${BILLING_BANK_TRANSFER_ENABLED:-true}
      - Billing__BankTransfer__AccountHolder=${BILLING_BANK_ACCOUNT_HOLDER:-}
      - Billing__BankTransfer__Iban=${BILLING_BANK_IBAN:-}
      - Billing__BankTransfer__Bic=${BILLING_BANK_BIC:-}
      - Billing__BankTransfer__BankName=${BILLING_BANK_NAME:-}
      - Billing__Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Billing__Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      - WebPush__PublicKey=${WEBPUSH_PUBLIC_KEY:-}
      - WebPush__PrivateKey=${WEBPUSH_PRIVATE_KEY:-}
      - WebPush__Subject=${WEBPUSH_SUBJECT:-mailto:admin@example.com}
      - Jobs__DailyMaintenance__RunAtUtc=${JOBS_DAILY_RUN_AT_UTC:-02:30}
      - Jobs__WeeklyDigest__Enabled=${JOBS_WEEKLY_DIGEST_ENABLED:-true}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cardexchange-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cardexchange-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-CardExchange2024!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-CardExchange2024!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - cardexchange-network

volumes:
  sqlserver-data:
    driver: local

networks:
  cardexchange-network:
    driver: bridge
